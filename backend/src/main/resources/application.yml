server:
  port: 7071
  servlet:
    context-path: /api

spring:
  application:
    name: manutrack-backend

  datasource:
    url: jdbc:mysql://localhost:3306/manutrack
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: Megha@94*#

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    open-in-view: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

jwt:
  secret: manutrack-super-secret-jwt-key-2024-production-ready-256-bits-long
  expiration: 86400000
  refresh-expiration: 604800000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.manutrack: DEBUG
    org.springframework.security: WARN